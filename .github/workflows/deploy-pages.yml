name: Deploy static frontends to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Set an "API_URL" repository variable (Settings > Secrets and
      # variables > Actions > Variables) once the backend has a real host.
      # Until then the deployed pages will load but fail to fetch data.
      VITE_API_URL: ${{ vars.API_URL }}
      EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build gate reader
        working-directory: gate-reader
        env:
          VITE_BASE_PATH: /thrupass/gate-reader/
        run: |
          npm ci
          npm run build

      - name: Build attendee app (web export)
        working-directory: app
        run: |
          npm ci
          npx expo export --platform web --output-dir dist

      - name: Assemble Pages site
        run: |
          set -e
          mkdir -p site/gate-reader site/app
          cp -r gate-reader/dist/. site/gate-reader/
          cp -r app/dist/. site/app/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Thru Pass</title>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
            <style>
              * { box-sizing: border-box; }
              body {
                background:#0B0C0E; color:#F4F5F6; font-family:'Manrope',sans-serif;
                display:flex; flex-direction:column; align-items:center; justify-content:center;
                height:100vh; margin:0; gap:32px;
              }
              .brand { display:flex; flex-direction:column; align-items:center; gap:22px; }
              .logo { width:84px; height:84px; border-radius:22px; background:#C8FF3D; display:flex; align-items:center; justify-content:center; }
              .logo-mark { width:36px; height:36px; border:4px solid #0B0C0E; border-right-color:transparent; border-radius:50%; transform:rotate(-45deg); }
              .wordmark { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:48px; letter-spacing:0.02em; }
              .slogan { font-size:15px; letter-spacing:0.26em; text-transform:uppercase; color:#8A9099; font-weight:600; }
              .links { display:flex; gap:20px; }
              a { color:#0B0C0E; background:#C8FF3D; font-family:'Manrope',sans-serif; font-weight:700; font-size:17px; text-decoration:none; padding:16px 30px; border-radius:999px; }
              a:hover { background:#dcff7a; }
            </style>
          </head>
          <body>
            <div class="brand">
              <div class="logo"><div class="logo-mark"></div></div>
              <div class="wordmark">THRUPASS</div>
              <div class="slogan">Seamless Access Control</div>
            </div>
            <div class="links">
              <a href="./gate-reader/">Client</a>
              <a href="./app/">Attendee app</a>
            </div>
          </body>
          </html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
