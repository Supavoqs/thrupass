<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Thru Pass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #0B0C0E;
      --text: #F4F5F6;
      --text-secondary: #8A9099;
      --lime: #C8FF3D;
      --lime-hover: #dcff7a;
      --surface: #16181C;
      --border: rgba(255,255,255,0.10);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F5F6F7;
        --text: #14161A;
        --text-secondary: #5B6169;
        --lime: #6B9B00;
        --lime-hover: #5c8500;
        --surface: #FFFFFF;
        --border: rgba(0,0,0,0.10);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0B0C0E; --text: #F4F5F6; --text-secondary: #8A9099;
      --lime: #C8FF3D; --lime-hover: #dcff7a; --surface: #16181C; --border: rgba(255,255,255,0.10);
    }
    :root[data-theme="light"] {
      --bg: #F5F6F7; --text: #14161A; --text-secondary: #5B6169;
      --lime: #6B9B00; --lime-hover: #5c8500; --surface: #FFFFFF; --border: rgba(0,0,0,0.10);
    }
    body {
      background: var(--bg); color: var(--text); font-family: 'Manrope', sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; margin: 0; gap: 32px; transition: background 0.15s ease, color 0.15s ease;
    }
    .theme-toggle {
      position: fixed; top: 24px; right: 24px; width: 40px; height: 40px; border-radius: 20px;
      background: var(--surface); border: 1px solid var(--border); cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 16px;
    }
    .brand { display: flex; flex-direction: column; align-items: center; gap: 22px; }
    .logo { width: 84px; height: 84px; border-radius: 22px; background: var(--lime); display: flex; align-items: center; justify-content: center; }
    .logo-mark { width: 36px; height: 36px; border: 4px solid #0B0C0E; border-right-color: transparent; border-radius: 50%; transform: rotate(-45deg); }
    .wordmark { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 48px; letter-spacing: 0.02em; }
    .slogan { font-size: 15px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--text-secondary); font-weight: 600; }
    .links { display: flex; gap: 20px; }
    a { color: #0B0C0E; background: var(--lime); font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 17px; text-decoration: none; padding: 16px 30px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.03em; }
    a:hover { background: var(--lime-hover); }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode"></button>

  <div class="brand">
    <div class="logo"><div class="logo-mark"></div></div>
    <div class="wordmark">THRUPASS</div>
    <div class="slogan">Seamless Access Control</div>
  </div>
  <div class="links">
    <a href="/client/">Client App</a>
    <a href="/app/">Attendee App</a>
  </div>

  <script>
    var root = document.documentElement;
    var btn = document.getElementById('themeToggle');
    var saved = localStorage.getItem('thrupass-theme');
    if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);

    function effectiveMode() {
      var attr = root.getAttribute('data-theme');
      if (attr) return attr;
      return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    function render() {
      btn.textContent = effectiveMode() === 'dark' ? '☀️' : '🌙';
    }
    btn.addEventListener('click', function () {
      var next = effectiveMode() === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('thrupass-theme', next);
      render();
    });
    render();
  </script>
</body>
</html>
