<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Pop N Lock Wristbands</title>
  <!-- Pill background -->
  <rect x="150" y="20" width="470" height="160" rx="80" fill="#0a0a0a"/>
  <!-- Emblem -->
  <circle cx="150" cy="100" r="96" fill="#0a0a0a"/>
  <circle cx="150" cy="100" r="83" fill="#ffffff"/>
  <circle cx="150" cy="100" r="72" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-dasharray="3 4"/>
  <!-- Fist icon -->
  <g transform="translate(150,104)">
    <path fill="#0a0a0a" d="M -34 -10
      C -34 -30 -20 -42 -6 -42
      C -6 -50 2 -56 10 -56
      C 18 -56 25 -50 26 -42
      C 34 -44 42 -38 43 -29
      C 51 -29 57 -23 57 -15
      L 57 18
      C 57 34 44 46 28 46
      L -8 46
      C -24 46 -34 34 -34 20
      Z"/>
    <path fill="#0a0a0a" d="M -34 14 L 57 14 L 57 24 L -34 24 Z" opacity="0"/>
    <!-- wristband across wrist -->
    <rect x="-34" y="18" width="91" height="13" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/>
    <rect x="-34" y="30" width="91" height="16" fill="#0a0a0a"/>
    <path d="M -20 30 L -8 46 M 6 30 L 18 46 M 32 30 L 44 46" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  </g>
  <!-- Wordmark -->
  <text x="266" y="98" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="50" fill="#ffffff" letter-spacing="1">POP N LOCK</text>
  <text x="270" y="132" font-family="Arial, sans-serif" font-weight="700" font-size="19" fill="#ffffff" letter-spacing="7">WRISTBANDS</text>
  <!-- Tagline -->
  <text x="385" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#0a0a0a">Secure Event Wristbands!</text>
</svg>
